name: Compilar CLEY COOE para Windows

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'electron/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Compilar instalador Windows x64
        run: npm run dist:win
      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CLEY-COOE-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
